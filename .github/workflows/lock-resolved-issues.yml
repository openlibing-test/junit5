name: Lock resolved issues

# Original triggers preserved; manual-only for test cost control.
# on:
#   schedule:
#     - cron: "39 1 * * 0"
#   workflow_dispatch:
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: lock-resolved-issues

jobs:
  action:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      discussions: write
    steps:
      - uses: dessant/lock-threads@7266a7ce5c1df01b1c6db85bf8cd86c737dadbe7 # v6.0.0
        with:
          process-only: issues
          log-output: true
