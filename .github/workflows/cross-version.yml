name: Cross-Version

# Original triggers preserved; manual-only for test cost control.
# on:
#   push:
#     branches:
#       - master
#       - 'releases/*'
#   pull_request:
#     branches:
#       - '*'
on:
  workflow_dispatch:

jobs:
  openjdk:
    strategy:
      matrix:
        jdk: [12, 13, 14, 15]
    name: "OpenJDK ${{ matrix.jdk }}"
    runs-on: ubuntu-latest
    container: "junitteam/build:${{ matrix.jdk }}"
    steps:
      - uses: actions/checkout@master
      - name: Test
        run: |
          ./gradlew --version
          ./gradlew --scan --no-parallel --warning-mode=all -Dplatform.tooling.support.tests.enabled=true -PjavaHome=$ADDITIONAL_JDK build
